
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sweetuuu ❤️</title>

<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4e8b,#6a5cff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:#fff;
text-align:center;
}
.card{
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,.3);
animation:zoom 2s infinite alternate;
}
h1{
font-size:42px;
margin:0;
}
h2{
font-size:28px;
color:yellow;
}
p{
font-size:20px;
}
@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}
.balloon{
position:absolute;
bottom:-100px;
font-size:40px;
animation:fly 8s linear infinite;
}
@keyframes fly{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}
</style>
</head>

<body>

<div class="balloon" style="left:10%;">🎈</div>
<div class="balloon" style="left:30%;animation-delay:2s;">🎈</div>
<div class="balloon" style="left:50%;animation-delay:4s;">🎈</div>
<div class="balloon" style="left:70%;animation-delay:1s;">🎈</div>
<div class="balloon" style="left:90%;animation-delay:3s;">🎈</div>

<div class="card">
<h1>🎂 Happy Birthday 🎂</h1>
<h2>Sweetuuu ❤️</h2>
<p>22/08/2003</p>
<p>💖 Wishing You Endless Happiness 💖</p>
</div>

</body>
</html>
